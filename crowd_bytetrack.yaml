# Ultralytics ByteTrack configuration for dense crowds (200-300+ people)
tracker_type: bytetrack     # Tracker type: ['botsort', 'bytetrack']
track_high_thresh: 0.35     # Threshold for 1st association stage (detect & match)
track_low_thresh: 0.10      # Threshold for 2nd association stage (recover occluded)
new_track_thresh: 0.45      # Minimum confidence to initialize a new track
track_buffer: 75            # Frames to maintain lost tracks (2.5s @ 30 FPS)
match_thresh: 0.70          # Hungarian assignment IoU distance threshold
fuse_score: True            # Fuse detection confidence into IoU similarity score

