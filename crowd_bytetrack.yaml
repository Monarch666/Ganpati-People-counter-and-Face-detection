# Ultralytics ByteTrack configuration for dense crowds (200-300+ people)
# HARDENED for maximum tracking stability in high-occlusion pandal scenarios
tracker_type: bytetrack     # Tracker type: ['botsort', 'bytetrack']
track_high_thresh: 0.30     # Lower threshold catches more people in 1st association
track_low_thresh: 0.08      # Very low threshold recovers heavily occluded people
new_track_thresh: 0.35      # Lower barrier to initialize new tracks in dense crowds
track_buffer: 120           # 4 seconds of memory @ 30fps (was 75) - keeps IDs alive longer
match_thresh: 0.80          # Stricter matching = fewer ID switches in dense crowds (was 0.70)
fuse_score: True            # Fuse detection confidence into IoU similarity score
